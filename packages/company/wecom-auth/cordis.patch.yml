- id: connection
  config:
    trustedHosts: !!js ctx.webStartup.trustedHosts
    requireBrowserLogin: true
- insert:
    - id: company-wecom-auth
      name: '@deepseek-ai/dsh-company-wecom-auth'
      config:
        corpId: !!js process.env.DSH_WECOM_CORP_ID ?? ''
        agentId: !!js process.env.DSH_WECOM_AGENT_ID ?? ''
        publicOrigin: !!js new URL(process.env.DSH_PUBLIC_URL ?? 'https://test-hmwork.busyming.com/').origin
        workspaceRoot: !!js process.env.DSH_WECOM_WORKSPACE_ROOT ?? ''
        gatewayIdentityEnabled: !!js process.env.DSH_GATEWAY_IDENTITY_ENABLED === '1'
        gatewayLogoutUrl: !!js process.env.DSH_GATEWAY_LOGOUT_URL ?? ''
    - id: company-user-mcp
      name: '@deepseek-ai/dsh-company-user-mcp'
      config:
        enabled: !!js process.env.DSH_USER_MCP_ENABLED === '1'
        listUrl: !!js process.env.DSH_MCP_LIST_URL ?? 'https://ai-gateway.busyming.com/mcp-servers/get-user-mcp-list'
        exchangeUrl: !!js process.env.DSH_MCP_EXCHANGE_URL ?? 'https://workflow-engine.busyming.com/token/exchange'
        platformId: !!js process.env.DSH_MCP_PLATFORM_ID ?? 'dsh'
        environment: !!js process.env.DSH_MCP_ENVIRONMENT ?? 'test'
        listApiKeyEnv: !!js process.env.DSH_MCP_LIST_API_KEY_ENV ?? 'DSH_MCP_LIST_API_KEY'
        platformSecretEnv: !!js process.env.DSH_MCP_PLATFORM_SECRET_ENV ?? 'DSH_MCP_PLATFORM_SECRET'
    - id: company-user-mcp-provider
      name: '@deepseek-ai/dsh-company-user-mcp/provider'
      disabled: !!js process.env.DSH_USER_MCP_ENABLED !== '1'
      config:
        enabled: true
        listUrl: !!js process.env.DSH_MCP_LIST_URL ?? 'https://ai-gateway.busyming.com/mcp-servers/get-user-mcp-list'
        exchangeUrl: !!js process.env.DSH_MCP_EXCHANGE_URL ?? 'https://workflow-engine.busyming.com/token/exchange'
        platformId: !!js process.env.DSH_MCP_PLATFORM_ID ?? 'dsh'
        environment: !!js process.env.DSH_MCP_ENVIRONMENT ?? 'test'
        listApiKeyEnv: !!js process.env.DSH_MCP_LIST_API_KEY_ENV ?? 'DSH_MCP_LIST_API_KEY'
        platformSecretEnv: !!js process.env.DSH_MCP_PLATFORM_SECRET_ENV ?? 'DSH_MCP_PLATFORM_SECRET'
